name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build package
        run: swift build
      - name: Test package
        run: swift test
      - name: Build PDFMercury for iOS Simulator
        run: >-
          xcodebuild -quiet
          -scheme PDFMercury
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
